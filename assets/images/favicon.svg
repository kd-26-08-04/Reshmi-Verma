<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133324" />
      <stop offset="60%" stop-color="#1B4D36" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>

    <!-- Leaf & Breath Flow Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Gold Vitality Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" ry="120" fill="url(#bgGrad)" filter="drop-shadow(0 16px 32px rgba(19, 51, 36, 0.35))" />
  
  <!-- Outer Subtle Breath Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(216, 243, 220, 0.2)" stroke-width="6" stroke-dasharray="12 12" />

  <!-- Botanical Leaf / Pranic Breath "R" Iconography -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
    
    <!-- Left Vertical Stem (Spine / Vagus Line) -->
    <path d="M 180 150 C 180 140, 195 130, 204 130 C 214 130, 218 140, 218 150 L 218 360 C 218 372, 204 378, 194 374 C 185 370, 180 360, 180 350 Z" fill="url(#leafGrad)" />

    <!-- Top Loop: Respiration Wave & Botanical Petal -->
    <path d="M 210 140 C 260 130, 330 145, 330 215 C 330 270, 275 285, 218 285" fill="none" stroke="url(#leafGrad)" stroke-width="32" stroke-linecap="round" />

    <!-- Lower Leg: Extending Vitality Branch -->
    <path d="M 245 270 C 275 295, 305 330, 335 365 C 342 373, 332 384, 322 380 C 298 355, 270 320, 242 290" fill="url(#leafGrad)" stroke="url(#leafGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Golden Circadian Vitality Core (Sun/Nerve Spark) -->
    <circle cx="265" cy="210" r="22" fill="url(#goldGlow)" />
  </g>
</svg>
